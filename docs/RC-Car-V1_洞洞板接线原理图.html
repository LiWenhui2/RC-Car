<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--background:#fff;--foreground:#151515;--card:#f7f7f7;--muted:#e8e8e8;--border:#999;--red:#d93025;--orange:#e8710a;--purple:#7e57c2;--blue:#1a73e8;--green:#0f9d58;--yellow:#e6a700}.btn{padding:7px 12px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#151515}.btn-primary{background:#151515;color:#fff}body{margin:16px;font-family:"Microsoft YaHei",Arial,sans-serif}</style></head><body><div id="rc-car-wiring-v1">
  <style>
    #rc-car-wiring-v1 { color: var(--foreground); }
    #rc-car-wiring-v1 .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    #rc-car-wiring-v1 .view { display:none; }
    #rc-car-wiring-v1 .view.active { display:block; }
    #rc-car-wiring-v1 svg { width:100%; height:auto; display:block; }
    #rc-car-wiring-v1 .board { fill:color-mix(in srgb, var(--muted) 28%, transparent); stroke:var(--border); stroke-width:2; }
    #rc-car-wiring-v1 .part { fill:color-mix(in srgb, var(--card) 86%, transparent); stroke:var(--foreground); stroke-width:1.4; }
    #rc-car-wiring-v1 .pin { fill:var(--background); stroke:var(--foreground); stroke-width:1; }
    #rc-car-wiring-v1 .keepout { fill:color-mix(in srgb, var(--yellow) 15%, transparent); stroke:var(--yellow); stroke-width:1.5; stroke-dasharray:8 6; }
    #rc-car-wiring-v1 .vb { stroke:var(--red); color:var(--red); }
    #rc-car-wiring-v1 .gnd { stroke:var(--foreground); color:var(--foreground); }
    #rc-car-wiring-v1 .v5 { stroke:var(--orange); color:var(--orange); }
    #rc-car-wiring-v1 .v33 { stroke:var(--purple); color:var(--purple); }
    #rc-car-wiring-v1 .sig { stroke:var(--blue); color:var(--blue); }
    #rc-car-wiring-v1 .motor { stroke:var(--green); color:var(--green); }
    #rc-car-wiring-v1 .wire { fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    #rc-car-wiring-v1 .thin { stroke-width:2.2; }
    #rc-car-wiring-v1 .bus { stroke-width:9; opacity:.78; }
    #rc-car-wiring-v1 text { fill:var(--foreground); font-size:14px; font-weight:400; }
    #rc-car-wiring-v1 .title { font-size:23px; font-weight:500; }
    #rc-car-wiring-v1 .subtitle { font-size:17px; font-weight:500; }
    #rc-car-wiring-v1 .small { font-size:12px; }
    #rc-car-wiring-v1 .tiny { font-size:10.5px; }
    #rc-car-wiring-v1 .net-label { font-size:12px; font-weight:500; }
    #rc-car-wiring-v1 .hole { fill:none; stroke:var(--border); stroke-width:.7; opacity:.65; }
    #rc-car-wiring-v1 .solder { fill:var(--muted); stroke:var(--foreground); stroke-width:1; }
    #rc-car-wiring-v1 .note { fill:color-mix(in srgb, var(--muted) 35%, transparent); stroke:var(--border); stroke-width:1; }
  </style>

  <div class="controls" aria-label="接线图视图">
    <button type="button" class="btn btn-primary" data-view="schematic" aria-pressed="true">车辆原理连接</button>
    <button type="button" class="btn" data-view="placement" aria-pressed="false">洞洞板元件面</button>
    <button type="button" class="btn" data-view="solder" aria-pressed="false">洞洞板焊接面</button>
    <button type="button" class="btn" data-view="remote" aria-pressed="false">遥控器A板</button>
  </div>

  <section class="view active" data-panel="schematic">
    <svg viewBox="0 0 1200 800" role="img" aria-labelledby="sch-title sch-desc">
      <title id="sch-title">RC-Car V1车辆原理连接图</title>
      <desc id="sch-desc">四节镍氢电池经过三条功率支路连接电机驱动、舵机和5V升降压模块。ESP32-C3用3.3V驱动TB6612逻辑，并通过八根控制线连接双电机与舵机。</desc>
      <text x="30" y="34" class="title">车辆B板：完整原理连接</text>
      <text x="30" y="58" class="small">红=VBAT　黑=GND　橙=5V逻辑　紫=3.3V逻辑　蓝=GPIO信号　绿=电机输出</text>

      <text x="115" y="133" text-anchor="middle" class="subtitle">4×AA镍氢电池</text>
      <text x="55" y="164">+　4.8～5.6V</text><circle cx="184" cy="158" r="7" class="pin"/>
      <text x="55" y="198">−　公共GND</text><circle cx="184" cy="192" r="7" class="pin"/>

      <rect x="245" y="92" width="180" height="150" rx="6" class="part"/>
      <text x="335" y="120" text-anchor="middle" class="subtitle">5V升降压模块</text>
      <text x="260" y="153">IN+</text><circle cx="250" cy="148" r="6" class="pin"/>
      <text x="260" y="187">IN−</text><circle cx="250" cy="182" r="6" class="pin"/>
      <text x="372" y="153">OUT+</text><circle cx="420" cy="148" r="6" class="pin"/>
      <text x="372" y="187">OUT−</text><circle cx="420" cy="182" r="6" class="pin"/>
      <text x="335" y="222" text-anchor="middle" class="small">输出先测量：4.9～5.1V</text>

      <rect x="505" y="80" width="235" height="322" rx="6" class="part"/>
      <text x="622" y="107" text-anchor="middle" class="subtitle">ESP32-C3 SuperMini（B）</text>
      <text x="525" y="135" class="tiny">左排全部引脚</text><text x="655" y="135" class="tiny">右排全部引脚</text>
      <g class="tiny">
        <text x="530" y="160">5V</text><circle cx="510" cy="155" r="5" class="pin"/>
        <text x="530" y="188">GND</text><circle cx="510" cy="183" r="5" class="pin"/>
        <text x="530" y="216">3V3</text><circle cx="510" cy="211" r="5" class="pin"/>
        <text x="530" y="244">GPIO4 → AIN2</text><circle cx="510" cy="239" r="5" class="pin"/>
        <text x="530" y="272">GPIO3 → AIN1</text><circle cx="510" cy="267" r="5" class="pin"/>
        <text x="530" y="300">GPIO2 未用</text><circle cx="510" cy="295" r="5" class="pin"/>
        <text x="530" y="328">GPIO1 未用</text><circle cx="510" cy="323" r="5" class="pin"/>
        <text x="530" y="356">GPIO0 未用</text><circle cx="510" cy="351" r="5" class="pin"/>
        <text x="655" y="160">GPIO10 → BIN2</text><circle cx="735" cy="155" r="5" class="pin"/>
        <text x="655" y="188">GPIO9 启动脚/未用</text><circle cx="735" cy="183" r="5" class="pin"/>
        <text x="655" y="216">GPIO8 启动脚/未用</text><circle cx="735" cy="211" r="5" class="pin"/>
        <text x="655" y="244">GPIO7 → BIN1</text><circle cx="735" cy="239" r="5" class="pin"/>
        <text x="655" y="272">GPIO6 → STBY</text><circle cx="735" cy="267" r="5" class="pin"/>
        <text x="655" y="300">GPIO5 → PWMA</text><circle cx="735" cy="295" r="5" class="pin"/>
        <text x="655" y="328">GPIO21 → SERVO</text><circle cx="735" cy="323" r="5" class="pin"/>
        <text x="655" y="356">GPIO20 → PWMB</text><circle cx="735" cy="351" r="5" class="pin"/>
      </g>
      <rect x="570" y="370" width="105" height="24" class="keepout"/>

        <text x="840" y="137">PWMA ← GPIO5</text><circle cx="815" cy="132" r="5" class="pin"/>
        <text x="840" y="170">AIN2 ← GPIO4</text><circle cx="815" cy="165" r="5" class="pin"/>
        <text x="840" y="203">AIN1 ← GPIO3</text><circle cx="815" cy="198" r="5" class="pin"/>
        <text x="840" y="236">STBY ← GPIO6</text><circle cx="815" cy="231" r="5" class="pin"/>
        <text x="840" y="269">BIN1 ← GPIO7</text><circle cx="815" cy="264" r="5" class="pin"/>
        <text x="840" y="302">BIN2 ← GPIO10</text><circle cx="815" cy="297" r="5" class="pin"/>
        <text x="840" y="335">PWMB ← GPIO20</text><circle cx="815" cy="330" r="5" class="pin"/>
        <text x="840" y="368">GND</text><circle cx="815" cy="363" r="5" class="pin"/>
        <text x="1050" y="137">VM ← VBAT+</text><circle cx="1150" cy="132" r="5" class="pin"/>
        <text x="1050" y="170">VCC ← 3V3</text><circle cx="1150" cy="165" r="5" class="pin"/>
        <text x="1050" y="203">GND</text><circle cx="1150" cy="198" r="5" class="pin"/>
        <text x="1050" y="236">AO1 → 后左电机</text><circle cx="1150" cy="231" r="5" class="pin"/>
        <text x="1050" y="269">AO2 → 后左电机</text><circle cx="1150" cy="264" r="5" class="pin"/>
        <text x="1050" y="302">BO2 → 后右电机</text><circle cx="1150" cy="297" r="5" class="pin"/>

        <text x="1050" y="368">GND</text><circle cx="1150" cy="363" r="5" class="pin"/>
      </g>

      <rect x="70" y="520" width="225" height="108" rx="6" class="part"/>
      <text x="182" y="548" text-anchor="middle" class="subtitle">MG995 舵机</text>
      <text x="90" y="577">红：VBAT+</text><circle cx="288" cy="572" r="6" class="pin"/>
      <text x="90" y="605">棕/黑：GND</text><circle cx="288" cy="600" r="6" class="pin"/>

      <rect x="825" y="510" width="145" height="80" rx="6" class="part"/>

      <text x="897" y="564" text-anchor="middle" class="small">AO1 / AO2</text>
      <rect x="1000" y="510" width="145" height="80" rx="6" class="part"/>
      <text x="1072" y="538" text-anchor="middle" class="subtitle">后右电机</text>
      <text x="1072" y="564" text-anchor="middle" class="small">BO1 / BO2</text>

      <rect x="330" y="520" width="165" height="108" rx="6" class="part"/>
      <text x="412" y="548" text-anchor="middle" class="subtitle">电容</text>
      <text x="345" y="575" class="small">C1 1000μF：VM-GND</text><circle cx="490" cy="563" r="5" class="pin"/><circle cx="490" cy="578" r="5" class="pin"/>
      <text x="345" y="604" class="small">C2 1000μF：舵机电源</text><circle cx="490" cy="592" r="5" class="pin"/><circle cx="490" cy="607" r="5" class="pin"/>
      <text x="345" y="620" class="tiny">C3/C4 100nF：各电机端子</text>

      <!-- Power and ground networks -->
      <path d="M184 158 H220 V148 H250" class="wire vb"/>
      <path d="M184 158 H470 V460 H1165 V132 H1150" class="wire vb"/>
      <path d="M184 158 H315 V485 H288 V572" class="wire vb"/>
      <path d="M184 192 H225 V182 H250" class="wire gnd"/>
      <path d="M184 192 H455 V680 H1165 V363 H1150" class="wire gnd"/>
      <path d="M420 182 H455" class="wire gnd"/>
      <path d="M455 680 V183 H510" class="wire gnd"/>
      <path d="M455 680 H288 V600" class="wire gnd"/>
      <path d="M455 680 H790 V363 H815" class="wire gnd thin"/>
      <path d="M490 563 H505 V460" class="wire vb thin"/><path d="M490 578 H475 V680" class="wire gnd thin"/>
      <path d="M490 592 H515 V485 H315" class="wire vb thin"/><path d="M490 607 H485 V680" class="wire gnd thin"/>
      <path d="M420 148 H470 V155 H510" class="wire v5"/>
      <path d="M510 211 H780 V165 H1150" class="wire v33"/>

      <!-- Signal harness summarized -->
      <path d="M735 295 H785 V132 H815" class="wire sig thin"/>
      <path d="M510 239 H770 V165 H815" class="wire sig thin"/>
      <path d="M510 267 H760 V198 H815" class="wire sig thin"/>
      <path d="M735 267 H775 V231 H815" class="wire sig thin"/>
      <path d="M735 239 H770 V264 H815" class="wire sig thin"/>
      <path d="M735 155 H760 V297 H815" class="wire sig thin"/>
      <path d="M735 351 H780 V330 H815" class="wire sig thin"/>

      <path d="M1150 231 H1175 V470 H897 V510" class="wire motor"/>

      <path d="M1150 330 H1175 V490 H1095 V510" class="wire motor thin"/>

      <rect x="30" y="712" width="1140" height="60" rx="4" class="note"/>
      <text x="50" y="739" class="small">烧录时：关闭车辆电池并断开升降压模块 OUT+→ESP32 5V，再连接USB。电机、舵机、电池主电流不得经过面包板或杜邦线。</text>
      <text x="50" y="761" class="small">电解电容负极条纹接GND；所有GND共地；车辆运行时不要同时接USB 5V与模块5V。</text>
    </svg>
  </section>

  <section class="view" data-panel="placement">
    <svg viewBox="0 0 1200 900" role="img" aria-labelledby="place-title place-desc">

      <desc id="place-desc">高电流接线端子放在左侧和下侧边缘，TB6612位于中央，ESP32位于右侧且天线朝板边。红色电池母线和黑色地母线与逻辑信号分开。</desc>

      <text x="30" y="32" class="title">7×9cm洞洞板：元件面（从上往下看）</text>
      <text x="30" y="57" class="small">先按实物干放；电源模块尺寸不确定时用4线端子连接并用铜柱固定，不强行焊死模块本体。</text>
      <rect x="65" y="85" width="980" height="756" class="board"/>
      <rect x="65" y="85" width="980" height="756" fill="url(#hole-grid-top)"/>
      <text x="85" y="112" class="small">高电流/电源区</text><text x="465" y="112" class="small">驱动区</text><text x="795" y="112" class="small">逻辑区（天线靠板边）</text>

      <rect x="95" y="145" width="150" height="68" rx="4" class="part"/>
      <text x="170" y="169" text-anchor="middle" class="subtitle">JBAT 2P</text><text x="170" y="193" text-anchor="middle" class="small">1=VBAT+　2=GND</text>
      <rect x="95" y="245" width="245" height="100" rx="4" class="part"/>
      <text x="217" y="272" text-anchor="middle" class="subtitle">5V模块/模块接口</text>
      <text x="112" y="300" class="small">IN+　IN−　OUT+　OUT−</text><text x="112" y="327" class="small">OUT+=ESP 5V；OUT−=GND</text>
      <rect x="95" y="395" width="180" height="70" rx="4" class="part"/>
      <text x="185" y="420" text-anchor="middle" class="subtitle">JSERVO 3P</text><text x="185" y="446" text-anchor="middle" class="small">GND｜VBAT｜SIG21</text>
      <rect x="95" y="525" width="155" height="65" rx="4" class="part"/>
      <text x="172" y="550" text-anchor="middle" class="subtitle">JML 2P</text><text x="172" y="574" text-anchor="middle" class="small">AO1｜AO2</text>
      <rect x="95" y="635" width="155" height="65" rx="4" class="part"/>
      <text x="172" y="660" text-anchor="middle" class="subtitle">JMR 2P</text><text x="172" y="684" text-anchor="middle" class="small">BO1｜BO2</text>

      <rect x="300" y="410" width="72" height="112" rx="4" class="part"/>
      <text x="336" y="432" text-anchor="middle" class="small">C1</text><text x="336" y="453" text-anchor="middle" class="tiny">1000μF</text><text x="336" y="476" text-anchor="middle" class="tiny">VM-GND</text><text x="336" y="500" text-anchor="middle" class="tiny">负极向GND母线</text>

      <g class="tiny">
        <text x="808" y="250">5V</text><text x="808" y="286">GND</text><text x="808" y="322">3V3</text><text x="808" y="358">GPIO4</text>

      <text x="1120" y="157" text-anchor="middle" class="subtitle">布局规则</text>
      <text x="1080" y="190" class="tiny">① 端子靠板边</text><text x="1080" y="217" class="tiny">② 粗电源线走边缘</text>
      <text x="1080" y="244" class="tiny">③ GPIO线走中间</text><text x="1080" y="271" class="tiny">④ VM电容靠驱动</text>

  <script>
    (() => {
      const root = document.getElementById('rc-car-wiring-v1');
      const buttons = [...root.querySelectorAll('[data-view]')];
      const panels = [...root.querySelectorAll('[data-panel]')];
      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          const selected = button.dataset.view;
          buttons.forEach((item) => {
            const active = item === button;
            item.classList.toggle('btn-primary', active);
            item.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
          panels.forEach((panel) => panel.classList.toggle('active', panel.dataset.panel === selected));
        });
      });
    })();
  </script>
